ERP_TEST:
  stage: 'COMMON'
  variables:
    BASE_NAME: 'ERP'
    SERVER_NAME: 'RTITS-CIS-02'
    SHORT_BASE: 'TEST'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin" OR $GITFLIC_USER_LOGIN == "dmitriy-klimashin" OR $GITFLIC_USER_LOGIN == "yuliya-davlyatshina" OR $GITFLIC_USER_LOGIN == "andrey-fedotov" OR $GITFLIC_USER_LOGIN == "elena-peshkova" OR $GITFLIC_USER_LOGIN == "elvin-binnatzade" OR $GITFLIC_USER_LOGIN == "aleksey-novichikhin" OR $GITFLIC_USER_LOGIN == "mikhail-madekin"
  when: manual
  script:
    - |
      $msg = 'Запускаю основной скрипт с параметрами: Сервер: {0} База: {1}_{2}' -f $env:SERVER_NAME,$env:BASE_NAME,$env:SHORT_BASE
      echo $msg
      $server_name = $env:SERVER_NAME
      $dbname = '{0}_{1}' -f $env:BASE_NAME,$env:SHORT_BASE
      # $logpath = 'D:\Users\{0}\GIT\.logs\{1}_{0}\' -f $env:SHORT_BASE,$env:BASE_NAME
      oscript sql\loadsqlcopy.os $server_name $dbname -encoding=windows-1251
  artifacts:
    paths:
      - Logs
