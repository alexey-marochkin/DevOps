stages:
  - 'MAV'
  - 'KDS'
  - 'MMY'
  - 'DJR'
  - 'BEF'
  - 'NAM'
  - 'COMMON'

'ERP_TEST':
  stage: 'COMMON'
  variables:
    - $BASE_NAME = 'ERP'
    - $SERVER_NAME = 'RTITS-CIS-02'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"
      variables:
        $SHORT_BASE = 'MAV'
    - if: $GITFLIC_USER_LOGIN == "dmitriy-klimashin"
      variables:
        $SHORT_BASE = 'KDS'
    - if: $GITFLIC_USER_LOGIN == "daniil-lobashov"
      variables:
        $SHORT_BASE = 'LDI'
    - if: $GITFLIC_USER_LOGIN == "yuliya-davlyatshina"
      variables:
        $SHORT_BASE = 'DJR'
    - if: $GITFLIC_USER_LOGIN == "elvin-binnatzade"
      variables:
        $SHORT_BASE = 'BEF'
    - if: $GITFLIC_USER_LOGIN == "aleksey-novichikhin"
      variables:
        $SHORT_BASE = 'NAM'
    - if: $GITFLIC_USER_LOGIN == "mikhail-madekin"
      variables:
        $SHORT_BASE = 'MMY'
  when: manual
  before_script:
    - |
      echo 'Проверяю наличие каталога логов (создам при отсутствии)';
      cmd /c if not exist D:\Users\$SHORT_BASE\GIT\.logs\$BASE_NAME_$SHORT_BASE\Logs mkdir D:\Users\$SHORT_BASE\GIT\.logs\$BASE_NAME_$SHORT_BASE\Logs;
  script:
    - |
      echo 'Запускаю основной скрипт с параметрами: Сервер: $SERVER_NAME База: $BASE_NAME_$SHORT_BASE';
      oscript sql\loadsqlcopy.os '$SERVER_NAME' '$BASE_NAME_$SHORT_BASE' 'D:\Users\$SHORT_BASE\GIT\.logs\$BASE_NAME_$SHORT_BASE' -encoding=windows-1251;
  artifacts:
    name: 'Logs'
    path: 'D:\Users\$SHORT_BASE\GIT\.logs\gitflic\$BASE_NAME_$SHORT_BASE\Logs'

# Марочкин
'Загрузить ERP_MAV':
  extends: 'ERP_TEST'
  stage: 'MAV'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"

'Загрузить ERP_NM_MAV':
  extends: 'ERP_TEST'
  variables: $BASE_NAME = 'ERP_NM'
  stage: 'MAV'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"

'Загрузить ECM_MAV':
  extends: 'ERP_TEST'
  variables: $BASE_NAME = 'ECM'  
  stage: 'MAV'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"

# Климашин
'Загрузить ERP_KDS':
  extends: 'ERP_TEST'
  stage: 'KDS'
  rules:
    - if: $GITFLIC_USER_LOGIN == "dmitriy-klimashin"

'Загрузить ERP_NM_KDS':
  extends: 'ERP_TEST'
  stage: 'KDS'
  variables: $BASE_NAME = 'ERP_NM'
  rules:
    - if: $GITFLIC_USER_LOGIN == "dmitriy-klimashin"

'Загрузить ECM_KDS':
  extends: 'ERP_TEST'
  stage: 'KDS'
  variables: $BASE_NAME = 'ECM'  
  rules:
    - if: $GITFLIC_USER_LOGIN == "dmitriy-klimashin"

# Давлятшина
'Загрузить ERP_DJR':
  extends: 'ERP_TEST'
  stage: 'DJR'
  rules:
    - if: $GITFLIC_USER_LOGIN == "yuliya-davlyatshina"

'Загрузить ERP_NM_DJR':
  extends: 'ERP_TEST'
  stage: 'DJR'
  variables: $BASE_NAME = 'ERP_NM'
  rules:
    - if: $GITFLIC_USER_LOGIN == "yuliya-davlyatshina"

'Загрузить ECM_DJR':
  extends: 'ERP_TEST'
  stage: 'DJR'
  variables: $BASE_NAME = 'ECM'  
  rules:
    - if: $GITFLIC_USER_LOGIN == "yuliya-davlyatshina"
