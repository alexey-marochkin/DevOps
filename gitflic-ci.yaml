stages:
  - 'MAV'
  - 'KDS'
  - 'MMY'
  - 'DJR'
  - 'BEF'
  - 'NAM'
  - 'LDI'
  - 'TAV'  
  - 'COMMON'

ERP_TEST:
  stage: 'COMMON'
  variables:
    BASE_NAME: 'ERP'
    SERVER_NAME: 'RTITS-CIS-02'
    SHORT_BASE: 'TEST'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin" OR $GITFLIC_USER_LOGIN == "dmitriy-klimashin" OR $GITFLIC_USER_LOGIN == "yuliya-davlyatshina" OR $GITFLIC_USER_LOGIN == "daniil-lobashov" OR $GITFLIC_USER_LOGIN == "elvin-binnatzade" OR $GITFLIC_USER_LOGIN == "aleksey-novichikhin" OR $GITFLIC_USER_LOGIN == "mikhail-madekin"
  when: manual
  before_script:
    - |
      $msg = 'Проверяю наличие каталога логов (создам при отсутствии) для базы {0}_{1}' -f $env:BASE_NAME, $env:SHORT_BASE
      echo $msg
      # $cmd = 'if not exist D:\Users\{0}\GIT\.logs\{1}_{0} mkdir D:\Users\{0}\GIT\.logs\{1}_{0}' -f $env:SHORT_BASE,$env:BASE_NAME
      # cmd /c $cmd
  script:
    - |
      $msg = 'Запускаю основной скрипт с параметрами: Сервер: {0} База: {1}_{2}' -f $env:SERVER_NAME,$env:BASE_NAME,$env:SHORT_BASE
      echo $msg
      $server_name = $env:SERVER_NAME
      $dbname = '{0}_{1}' -f $env:BASE_NAME,$env:SHORT_BASE
      # $logpath = 'D:\Users\{0}\GIT\.logs\{1}_{0}\' -f $env:SHORT_BASE,$env:BASE_NAME
      oscript sql\loadsqlcopy.os $server_name $dbname -encoding=windows-1251
  artifacts:
    paths:
      - Logs

ERP_NM_TEST:
  extends: 'ERP_TEST'
  variables:
    BASE_NAME: 'ERPNM'

ECM_TEST:
  extends: 'ERP_TEST'
  variables:
    BASE_NAME: 'ECM'

ECM3_TEST:
  extends: 'ERP_TEST'
  variables:
    BASE_NAME: 'ECM3'    

