stages:
  - 'MAV'
  - 'KDS'
  - 'MMY'
  - 'DJR'
  - 'BEF'
  - 'NAM'
  - 'COMMON'

ERP_TEST:
  stage: 'COMMON'
  variables:
    BASE_NAME: 'ERP'
    SERVER_NAME: 'RTITS-CIS-02'
    SHORT_BASE: 'TEMP'
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"
      variables:
        SHORT_BASE: 'MAV'
    - if: $GITFLIC_USER_LOGIN == "dmitriy-klimashin"
      variables:
        SHORT_BASE: 'KDS'
    - if: $GITFLIC_USER_LOGIN == "daniil-lobashov"
      variables:
        SHORT_BASE: 'LDI'
    - if: $GITFLIC_USER_LOGIN == "yuliya-davlyatshina"
      variables:
        SHORT_BASE: 'DJR'
    - if: $GITFLIC_USER_LOGIN == "elvin-binnatzade"
      variables:
        SHORT_BASE: 'BEF'
    - if: $GITFLIC_USER_LOGIN == "aleksey-novichikhin"
      variables:
        SHORT_BASE: 'NAM'
    - if: $GITFLIC_USER_LOGIN == "mikhail-madekin"
      variables:
        SHORT_BASE: 'MMY'
  when: manual
  before_script:
    - |
      $msg = 'Проверяю наличие каталога логов (создам при отсутствии) для базы {0}_{1}' -f $env:BASE_NAME, $env:SHORT_BASE
      echo $msg
      $cmd = 'if not exist D:\Users\{0}\GIT\.logs\{1}_{0}\Logs mkdir D:\Users\{0}\GIT\.logs\{1}_{0}\Logs' -f $env:SHORT_BASE,$env:BASE_NAME
      cmd /c $cmd
  script:
    - |
      $msg = 'Запускаю основной скрипт с параметрами: Сервер: {0} База: {1}_{2}' -f $env:SERVER_NAME,$env:BASE_NAME,$env:SHORT_BASE
      echo $msg
      $server_name = $env:SERVER_NAME
      $dbname = '{0}_{1}' -f $env:BASE_NAME,$env:SHORT_BASE
      $logpath = 'D:\Users\{0}\GIT\.logs\{1}_{0}' -f $env:SHORT_BASE,$env:BASE_NAME
      oscript sql\loadsqlcopy.os $server_name $dbname $logpath -encoding=windows-1251

# Марочкин
ERP_MAV:
  extends: 'ERP_TEST'
  stage: 'MAV'
  rules:
    - if: '$GITFLIC_USER_LOGIN == "aleksey-marochkin"'

ERP_NM_MAV:
  extends: 'ERP_TEST'
  variables:
    BASE_NAME: 'ERP_NM'
  stage: 'MAV'
  rules:
    - if: '$GITFLIC_USER_LOGIN == "aleksey-marochkin"'

ECM_MAV:
  extends: 'ERP_TEST'
  variables:
    BASE_NAME: 'ECM'
  stage: 'MAV'
  rules:
    - if: '$GITFLIC_USER_LOGIN == "aleksey-marochkin"'

