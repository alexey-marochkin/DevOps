stages:
  - 'MAV'
  - 'KDS'
  - 'MMY'
  - 'DJR'
  - 'BEF'
  - 'NAM'
  - 'COMMON'

'Загрузить ERP_MAV':
  stage: 'MAV'
  script:
    - |
      [console]::OutputEncoding = [System.Text.Encoding]::GetEncoding('windows-1251');
      echo 'Понеслась родная';
      Start-Sleep -Seconds 30;
      cmd /c if not exist D:\Users\MAV\GIT\.logs\gitflic\ERP_MAV\Logs mkdir D:\Users\MAV\GIT\.logs\gitflic\ERP_MAV\Logs;
      oscript -v;
      $script = ($(get-location).Path + '\sql\loadsqlcopy.os');
      echo $script;
      oscript $script 'RTITS-CIS-02' 'ERP_MAV' 'D:\Users\MAV\GIT\.logs\gitflic\ERP_MAV' -encoding=windows-1251;

  artifacts:
    name: 'Журнал'
    paths: D:\Users\MAV\GIT\.logs\gitflic\ERP_MAV\Logs    
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"

'Загрузить ERP_NM_MAV':
  stage: 'MAV'
  script: echo 'ТЕСТ'
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"

'Загрузить ECM_MAV':
  stage: 'MAV'
  script: echo 'ТЕСТ'
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"



'Загрузить ERP_KDS':
  stage: 'KDS'
  script: >
    [console]::OutputEncoding = [System.Text.Encoding]::GetEncoding('windows-1251');
    cmd /c if not exist Logs mkdir Logs;
    oscript ($(get-location).Path + "\sql\loadsqlcopy.os") RTITS-CIS-02 ERP_MAV D:\Users\MAV\GIT\.logs\gitflic\ERP_MAV -encoding=windows-1251
  artifacts:
    name: 'Журнал'
    paths: Logs    
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin" || $GITFLIC_USER_LOGIN == "dmitry-klimashin"

'Загрузить ERP_NM_KDS':
  stage: 'KDS'
  script: echo 'ТЕСТ'
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin" || $GITFLIC_USER_LOGIN == "dmitry-klimashin"

'Загрузить ECM_KDS':
  stage: 'KDS'
  script: echo 'ТЕСТ'
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin" || $GITFLIC_USER_LOGIN == "dmitry-klimashin"
