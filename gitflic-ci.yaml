stages:
  - 'ERP_MAV'
  - 'ERP_KDS'
  - 'ERP_MMY'
  - 'ERP_DJR'
  - 'ERP_BEF'
  - 'ERP_NAM'

before_script:
  - $OutputEncoding = [console]::InputEncoding = [console]::OutputEncoding = New-Object System.Text.UTF8Encoding

test:
  stage: 'ERP_MAV'
  when: manual
  script:
    - dir
    - [console]::OutputEncoding
    - echo "Тестируем кириллицу в логах гитфлика"

'Загрузить':
  stage: 'ERP_MAV'
  script:
    - dir
    - cmd /c if not exist Logs mkdir Logs
    - oscript -encoding=utf-8 sql\loadsqlcopy.os RTITS-CIS-02 ERP_MAV .
  artifacts:
    name: 'Журнал'
    paths: Logs    
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"
