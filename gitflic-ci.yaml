stages:
  - 'ERP_MAV'
  - 'ERP_KDS'
  - 'ERP_MMY'
  - 'ERP_DJR'
  - 'ERP_BEF'
  - 'ERP_NAM'

'Загрузить ERP_MAV':
  stage: 'ERP_MAV'
  script: >
    [console]::OutputEncoding = [System.Text.Encoding]::GetEncoding('windows-1251');
    cmd /c if not exist Logs mkdir Logs;
    oscript -encoding=utf-8 sql\loadsqlcopy.os RTITS-CIS-02 ERP_MAV .
  artifacts:
    name: 'Журнал'
    paths: Logs    
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin"

'Загрузить ERP_KDS':
  stage: 'ERP_KDS'
  script: >
    [console]::OutputEncoding = [System.Text.Encoding]::GetEncoding('windows-1251');
    cmd /c if not exist Logs mkdir Logs;
    oscript -encoding=utf-8 sql\loadsqlcopy.os RTITS-CIS-02 ERP_MAV .
  artifacts:
    name: 'Журнал'
    paths: Logs    
  when: manual
  rules:
    - if: $GITFLIC_USER_LOGIN == "aleksey-marochkin1" || $GITFLIC_USER_LOGIN == "dmitry-klimashin"
